# ARGUS: keep the system journal in RAM so logging never writes to the SD card.
# Installed by deploy/sd-hardening/apply_sd_hardening.sh as
# /etc/systemd/journald.conf.d/90-argus-volatile.conf. Remove it to go back.
#
# Trade-off: logs are lost on reboot. Before a reboot you care about, save them:
#   journalctl -u argus-node -b > ~/argus-node-$(date +%F-%H%M).log
[Journal]
Storage=volatile
RuntimeMaxUse=64M
RuntimeMaxFileSize=8M
ForwardToSyslog=no
