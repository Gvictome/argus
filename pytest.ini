[pytest]
testpaths = tests
# The FL scheduler is asyncio, so its tests need pytest-asyncio. strict
# mode means an async test without @pytest.mark.asyncio fails loudly
# rather than being silently skipped -- a skipped async test reports
# green while asserting nothing.
asyncio_mode = strict
markers =
    slow: takes seconds rather than milliseconds (spawns a process, decodes
        video, or waits on a network timeout). Deselect with -m "not slow".
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
