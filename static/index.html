<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGUS — Live Monitor</title>
<style>
  /* Single file, no build step, no CDN: the demo unit runs offline and a
     blocked font or script request at a booth is a failed demo. */
  :root {
    --bg:#0b0f14; --panel:#121924; --panel-2:#18212f; --line:#243044;
    --text:#e6edf7; --muted:#8fa3bf; --accent:#4da3ff;
    --ok:#31d07a; --warn:#ffb020; --danger:#ff4d4f;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); }
  header {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  h1 { margin:0; font-size:18px; letter-spacing:.14em; font-weight:700; }
  .sub { color:var(--muted); font-size:12px; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; align-items:center; }
  .badge {
    font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    padding:5px 10px; border-radius:999px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--muted);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .badge.on { color:var(--ok); border-color:#1d5b3c; background:#0f2419; }
  .badge.bad { color:var(--danger); border-color:#5b1d1d; background:#241010; }
  .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:16px; padding:16px; }
  @media (max-width:1000px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card h2 {
    margin:0; padding:10px 14px; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px;
  }
  #videoWrap { position:relative; background:#000; min-height:280px; display:flex;
               align-items:center; justify-content:center; }
  #video { width:100%; display:block; }
  #videoMsg { position:absolute; color:var(--muted); font-size:13px; text-align:center; padding:20px; }
  #liveTag {
    position:absolute; top:10px; left:10px; padding:5px 10px; border-radius:999px;
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:#0f2419; color:var(--ok); border:1px solid #1d5b3c; display:none;
  }
  #liveTag.active { display:block; background:#241c0f; color:var(--warn); border-color:#5b4413; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:1px;
           background:var(--line); border-top:1px solid var(--line); }
  .stat { background:var(--panel); padding:10px 12px; }
  .stat .k { color:var(--muted); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
  .stat .v { font-size:19px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }
  ul.events { list-style:none; margin:0; padding:0; max-height:70vh; overflow:auto; }
  ul.events li { display:flex; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); align-items:center; }
  ul.events img { width:74px; height:52px; object-fit:cover; border-radius:6px;
                  background:var(--panel-2); border:1px solid var(--line); flex:none; }
  .ev-main { min-width:0; flex:1; }
  .ev-label { font-size:13px; font-weight:600; }
  .ev-meta { color:var(--muted); font-size:11px; margin-top:2px; }
  .pill { font-size:10px; padding:3px 8px; border-radius:999px; border:1px solid var(--line);
          color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .pill.alert { color:var(--danger); border-color:#5b1d1d; background:#241010; }
  .empty { color:var(--muted); font-size:13px; padding:24px; text-align:center; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line);
           border-radius:10px; padding:18px; }
  input, button { font:inherit; }
  input { background:var(--panel-2); border:1px solid var(--line); color:var(--text);
          border-radius:6px; padding:8px 10px; width:100%; margin-top:8px; }
  button { background:var(--accent); color:#04121f; border:0; border-radius:6px;
           padding:8px 14px; font-weight:600; cursor:pointer; margin-top:10px; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div>
    <h1>ARGUS</h1>
    <div class="sub" id="nodeName">Live monitor</div>
  </div>
  <div class="badges">
    <span class="badge" id="bConn"><i class="dot"></i><span id="connText">Connecting</span></span>
    <span class="badge" id="bFps">-- FPS</span>
    <span class="badge" id="bBackend">Backend --</span>
    <span class="badge" id="bModel">Model --</span>
    <button class="ghost" id="btnLogout" style="display:none;margin:0;padding:5px 10px;font-size:11px;">Log out</button>
  </div>
</header>

<main>
  <section class="card">
    <h2>Live feed</h2>
    <div id="videoWrap">
      <span id="liveTag">Idle</span>
      <img id="video" alt="Live annotated camera feed">
      <div id="videoMsg">Connecting to camera…</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Detect FPS</div><div class="v" id="sFps">--</div></div>
      <div class="stat"><div class="k">Capture FPS</div><div class="v" id="sCap">--</div></div>
      <div class="stat"><div class="k">ms / frame</div><div class="v" id="sMs">--</div></div>
      <div class="stat"><div class="k">In frame</div><div class="v" id="sTracks">0</div></div>
      <div class="stat"><div class="k">Events</div><div class="v" id="sEvents">0</div></div>
      <div class="stat"><div class="k">Motion</div><div class="v" id="sMotion">0</div></div>
    </div>
  </section>

  <section class="card">
    <h2>Recent events <span class="sub" id="evCount"></span></h2>
    <ul class="events" id="eventList"></ul>
    <div class="empty" id="evEmpty">No events yet — walk in front of the camera.</div>
  </section>
</main>

<dialog id="loginDlg">
  <form method="dialog" id="loginForm">
    <div style="font-weight:600;">Sign in</div>
    <div class="sub" style="margin-top:4px;">This node requires a token.</div>
    <input id="user" placeholder="Username" value="admin" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="btnLogin">Sign in</button>
    <div class="sub" id="loginErr" style="margin-top:8px;"></div>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  // sessionStorage, not localStorage: the token dies with the tab rather
  // than sitting on a shared demo laptop until someone clears it.
  var TOKEN_KEY = "argus_token";
  var POLL_MS = 1000, EVENTS_MS = 3000;
  var el = function (id) { return document.getElementById(id); };
  var token = function () { return sessionStorage.getItem(TOKEN_KEY) || ""; };

  function headers() {
    var h = {};
    var t = token();
    if (t) { h["Authorization"] = "Bearer " + t; }
    return h;
  }

  function get(path) {
    return fetch(path, { headers: headers() }).then(function (r) {
      if (r.status === 401) { el("loginDlg").showModal(); throw new Error("unauthorized"); }
      if (!r.ok) { throw new Error(path + " " + r.status); }
      return r.json();
    });
  }

  function setConn(ok, text) {
    var b = el("bConn");
    b.className = "badge " + (ok ? "on" : "bad");
    el("connText").textContent = text;
  }

  // An <img> cannot send an Authorization header, so the stream takes the
  // token in the query string instead. Without this the feed is blank
  // whenever auth is on, which is always through a tunnel.
  function streamUrl() {
    var q = new URLSearchParams();
    var t = token();
    if (t) { q.set("token", t); }
    q.set("t", String(Date.now()));
    return "/api/camera/stream?" + q.toString();
  }

  function startStream() {
    var img = el("video");
    img.onload = function () { el("videoMsg").style.display = "none"; };
    img.onerror = function () {
      el("videoMsg").style.display = "block";
      el("videoMsg").textContent = "Camera unavailable";
    };
    img.src = streamUrl();
  }

  function pollStatus() {
    Promise.all([get("/api/status"), get("/api/detection/status")])
      .then(function (r) {
        var st = r[0], det = r[1];
        var w = det.worker || {}, c = det.collector || {};
        var fps = (w.detect_fps !== undefined ? w.detect_fps : st.fps) || 0;

        setConn(true, "Live");
        el("nodeName").textContent = (st.node || "Node") + " · " + (st.samples ? st.samples.total + " samples" : "");
        el("bFps").textContent = fps.toFixed(1) + " FPS";
        el("bBackend").textContent = "Backend " + (st.accelerator || det.backend || "--");
        el("bModel").textContent = "Model " + (st.model_version || "--");

        el("sFps").textContent = fps.toFixed(1);
        el("sCap").textContent = (w.capture_fps || 0).toFixed(1);
        el("sMs").textContent = Math.round(w.detect_ms || 0);
        el("sTracks").textContent = c.open_tracks || 0;
        el("sEvents").textContent = c.emitted || 0;
        el("sMotion").textContent = c.motion_events || 0;

        var tag = el("liveTag");
        if (c.open_tracks > 0) {
          tag.className = "active";
          tag.textContent = "Detecting " + c.open_tracks;
        } else {
          tag.className = "";
          tag.textContent = "Idle";
        }
        tag.style.display = "block";

        if (w.camera_error) {
          el("videoMsg").style.display = "block";
          el("videoMsg").textContent = "Camera error: " + w.camera_error;
        }
      })
      .catch(function (e) {
        if (String(e.message) !== "unauthorized") { setConn(false, "Offline"); }
      });
  }

  function timeAgo(iso) {
    var secs = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (secs < 60) { return Math.round(secs) + "s ago"; }
    if (secs < 3600) { return Math.round(secs / 60) + "m ago"; }
    return Math.round(secs / 3600) + "h ago";
  }

  function renderEvents(events) {
    var list = el("eventList");
    el("evEmpty").style.display = events.length ? "none" : "block";
    el("evCount").textContent = events.length ? events.length + " shown" : "";
    list.replaceChildren();

    events.forEach(function (ev) {
      var li = document.createElement("li");

      var img = document.createElement("img");
      img.alt = "";
      if (ev.snapshot) { img.src = ev.snapshot + (token() ? "?token=" + token() : ""); }
      li.appendChild(img);

      var main = document.createElement("div");
      main.className = "ev-main";
      var label = document.createElement("div");
      label.className = "ev-label";
      // Labels carry operator-entered text. textContent, never innerHTML.
      label.textContent = ev.label || ev.cls;
      var meta = document.createElement("div");
      meta.className = "ev-meta";
      meta.textContent = ev.zone + " · " + ev.node + " · " + ev.confidence + "% · " + timeAgo(ev.ts);
      main.appendChild(label);
      main.appendChild(meta);
      li.appendChild(main);

      var pill = document.createElement("span");
      pill.className = "pill" + (ev.status === "stranger" ? " alert" : "");
      pill.textContent = ev.status === "stranger" ? "Unusual" : ev.cls;
      li.appendChild(pill);

      list.appendChild(li);
    });
  }

  function pollEvents() {
    get("/api/events?limit=25").then(renderEvents).catch(function () {});
  }

  el("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: el("user").value, password: el("pass").value })
    })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("Invalid credentials")); })
      .then(function (data) {
        sessionStorage.setItem(TOKEN_KEY, data.token || data.access_token || "");
        el("loginDlg").close();
        el("btnLogout").style.display = "block";
        startStream();
        pollStatus();
        pollEvents();
      })
      .catch(function (err) { el("loginErr").textContent = err.message; });
  });

  el("btnLogout").addEventListener("click", function () {
    sessionStorage.removeItem(TOKEN_KEY);
    location.reload();
  });

  if (token()) { el("btnLogout").style.display = "block"; }
  startStream();
  pollStatus();
  pollEvents();
  setInterval(pollStatus, POLL_MS);
  setInterval(pollEvents, EVENTS_MS);
})();
</script>
</body>
</html>
